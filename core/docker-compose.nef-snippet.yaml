# Merge these fields into the existing services in docker-compose.yaml.
# Replace the example IP addresses with the actual Core and IUF VM addresses.
services:
  free5gc-nrf:
    ports:
      - "192.168.192.145:8001:8000"

  free5gc-nef:
    build:
      context: ./base
      dockerfile: Dockerfile.nf
      args:
        F5GC_MODULE: nef
    image: free5gc/nef:iuf-relay
    ports:
      - "192.168.192.145:8005:8000"
    env_file:
      - ./flask-nef/scf.env
    environment:
      GIN_MODE: release
      SCF_INTENT_URL: http://192.168.192.145:5001/intent


